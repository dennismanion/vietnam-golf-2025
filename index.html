        .tab.active { background: #e8f5e9; color: var(--p); }
        .sc { display: none; padding: 15px; }
        .sc.active { display: block; }
        .hnav { display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px; border-radius: 8px; margin-bottom: 15px; }
        .hnav button { background: var(--a); color: white; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; font-size: 1.2rem; }
        .cbox { background: white; border-radius: 12px; padding: 25px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .crow { display: flex; justify-content: center; align-items: center; gap: 25px; margin: 15px 0; }
        .cbtn { width: 60px; height: 60px; background: #e8f5e9; border-radius: 50%; font-size: 1.8rem; border: 1px solid #c8e6c9; color: var(--p); }
        .row { display: flex; background: white; padding: 12px 10px; border-bottom: 1px solid #eee; align-items: center; font-size: 0.9rem; }
        .sbtn { background: #0288d1; color: white; width: 100%; border: none; padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 15px; font-size: 1rem; }
        .room-tag { background: rgba(255,255,255,0.2); display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; margin-top: 5px; }
        .toast { position: fixed; top: -60px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.85); color: white; padding: 10px 20px; border-radius: 30px; font-size: 0.9rem; font-weight: bold; z-index: 1000; transition: top 0.3s ease, opacity 0.3s ease; opacity: 0; pointer-events: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .toast.show { top: 20px; opacity: 1; }

        .welcome-box { background: white; border-radius: 12px; padding: 20px; margin-top: 20px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .sel-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
        .sel-btn { background: white; border: 2px solid #ddd; padding: 15px 10px; border-radius: 8px; font-weight: bold; font-size: 1.1rem; color: #333; cursor: pointer; }
        .sel-btn:active { background: #e8f5e9; border-color: var(--p); }
        .sw-link { font-size: 0.85rem; color: #0288d1; text-decoration: underline; background: none; border: none; cursor: pointer; margin-top: 5px; display: inline-block; }

        .my-row { background: #fff9c4 !important; border-left: 4px solid #fbc02d; }

        /* Round picker (score entry screen) */
        .round-pick { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 15px; }
        .round-btn { flex: 0 0 auto; background: white; border: 2px solid #ddd; padding: 8px 14px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; color: #555; white-space: nowrap; }
        .round-btn.active { background: var(--p); border-color: var(--p); color: white; }
        .course-label { font-size: 0.8rem; color: #888; margin-top: 2px; }

        /* Round filter tabs (leaderboard screen) */
        .lb-filters { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; }
        .lb-chip { flex: 0 0 auto; background: white; border: 1px solid #ccc; padding: 6px 12px; border-radius: 16px; font-size: 0.8rem; font-weight: bold; color: #555; white-space: nowrap; }
        .lb-chip.active { background: #0288d1; border-color: #0288d1; color: white; }
    </style>
</head>
<body>
    <div id="toast" class="toast">Saved!</div>

    <div class="h">
        <h1 id="ht">⛳ VN Golf Legends</h1>
        <div id="roomDisplay" class="room-tag" onclick="window.tapRoomTag()" style="user-select:none; cursor:pointer;">Room: Loading...</div>
    </div>

    <div id="s-setup" class="sc active">
        <div class="welcome-box">
            <h2>Select Your Name</h2>
            <p style="color: #666; margin-top: 5px;">Choose your profile to begin scoring your round.</p>
            <div class="sel-grid" id="setup-grid"></div>
        </div>
    </div>

    <div id="s-in" class="sc">
        <div class="round-pick" id="roundPick"></div>

        <div class="hnav">
            <button onclick="window.chHole(-1)">◀</button>
            <div style="text-align:center">
                <h2 id="hd">Hole 1</h2>
                <div id="hdt" style="font-size: 0.8rem; color: #666; margin-top: 2px;">Par 4 | SI 8</div>
                <div id="courseLabel" class="course-label">Course</div>
            </div>
            <button onclick="window.chHole(1)">▶</button>
        </div>

        <div class="cbox">
            <h2 id="pNameDisplay" style="color: var(--p); font-size: 1.8rem; margin-bottom: 2px;">Player</h2>
            <button class="sw-link" onclick="window.showSetup()">◀ Switch Profile</button>
            <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">
            <p style="color: #666; font-size: 1.1rem; font-weight: 500;">Gross Score</p>
            <div class="crow">
                <button class="cbtn" onclick="window.adj(-1)">−</button>
                <div style="font-size:4.5rem;font-weight:bold;width:90px;" id="sd">-</div>
                <button class="cbtn" onclick="window.adj(1)">+</button>
            </div>
            <button class="sbtn" onclick="window.shareRoom()">🔗 Share Game Invite Link</button>
        </div>
    </div>

    <div id="s-bd" class="sc">
        <div class="lb-filters" id="lbFilters"></div>
        <div style="display:flex;background:#e0e0e0;padding:10px;font-weight:bold;font-size:0.85rem;border-radius:4px;margin-bottom:5px;">
            <div style="width:10%">Pos</div><div style="width:40%">Player</div>
            <div style="width:15%;text-align:center">Thru</div><div style="width:20%;text-align:center">Net</div>
            <div style="width:15%;text-align:right">Pts</div>
        </div>
        <div id="lbl"></div>
    </div>

    <div class="tabs" id="bottom-tabs" style="display:none;">
        <button class="tab active" id="t-in" onclick="window.sw('in')">✍️ My Score</button>
        <button class="tab" id="t-bd" onclick="window.sw('bd')">🏆 Board</button>
    </div>
    <script>
        const config = {
            apiKey: "AIzaSyAJhRYf1PYn1mR__ycIyfVFehM1GWMTPco",
            authDomain: "vietnam-golf-2025.firebaseapp.com",
            projectId: "vietnam-golf-2025",
            storageBucket: "vietnam-golf-2025.firebasestorage.app",
            messagingSenderId: "1055381438269",
            appId: "1:1055381438269:web:27e34cc9924d41affa4f54",
            databaseURL: "https://vietnam-golf-2025-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        let db = null;
        try {
            firebase.initializeApp(config);
            db = firebase.database();
        } catch(e) {
            console.warn("Database initialization deferred.", e);
        }

        const pls = [
            { id: 1, name: 'Ben', handicap: 20 }, { id: 2, name: 'Ian', handicap: 16 },
            { id: 3, name: 'Peter', handicap: 23 }, { id: 4, name: 'Neale', handicap: 28 },
            { id: 5, name: 'Neal', handicap: 6 }, { id: 6, name: 'Dennis', handicap: 13 },
            { id: 7, name: 'Tony', handicap: 30 }, { id: 8, name: 'Brad', handicap: 32 }
        ];

        // ===== COURSES =====
        // "si" = stroke index (1 = hardest hole, 18 = easiest) — used for handicap strokes.
        const courses = {
            c1: {
                name: 'Course A',
                holes: {
                    1: { par: 4, si: 16 },  2: { par: 5, si: 4 }, 3: { par: 4, si: 4 },
                    4: { par: 3, si: 10 }, 5: { par: 4, si: 6 },  6: { par: 3, si: 18 },
                    7: { par: 5, si: 12 },  8: { par: 4, si: 17 }, 9: { par: 4, si: 8 },
                    10: { par: 4, si: 7 }, 11: { par: 4, si: 11 }, 12: { par: 5, si: 15 },
                    13: { par: 4, si: 1 },  14: { par: 3, si: 17 },  15: { par: 4, si: 3 },
                    16: { par: 4, si: 5 }, 17: { par: 3, si: 9 },  18: { par: 5, si: 13 }
                }
            },
            c2: {
                name: 'Course B',
                holes: {
                    1: { par: 4, si: 5 },  2: { par: 3, si: 17 }, 3: { par: 5, si: 11 },
                    4: { par: 3, si: 13 }, 5: { par: 4, si: 15 },  6: { par: 4, si: 3 },
                    7: { par: 4, si: 1 },  8: { par: 5, si: 9 }, 9: { par: 4, si: 7 },
                    10: { par: 4, si: 2 }, 11: { par: 4, si: 8 }, 12: { par: 3, si: 14 },
                    13: { par: 5, si: 12 },  14: { par: 4, si: 16 },  15: { par: 3, si: 18 },
                    16: { par: 4, si: 6 }, 17: { par: 3, si: 10 },  18: { par: 4, si: 4 }
                }
            },
            c3: {
                name: 'Course C',
                holes: {
                    1: { par: 4, si: 7 },  2: { par: 5, si: 13 }, 3: { par: 3, si: 15 },
                    4: { par: 4, si: 11 }, 5: { par: 4, si: 1 },  6: { par: 5, si: 9 },
                    7: { par: 4, si: 5 },  8: { par: 3, si: 17 }, 9: { par: 4, si: 3 },
                    10: { par: 4, si: 6 }, 11: { par: 3, si: 10 }, 12: { par: 4, si: 2 },
                    13: { par: 5, si: 8 },  14: { par: 3, si: 14 },  15: { par: 4, si: 4 },
                    16: { par: 4, si: 18 }, 17: { par: 4, si: 16 },  18: { par: 5, si: 12 }
                }
            }
        };

        // ===== ROUNDS =====
        // Assigns which course each round is played on.
        // r2 and r4 (Black Mountain Day 1 & 2) share c3 (Course C) — same layout,
        // but each round still has its own independent score sheet in `scs`.
        // Switching rounds always prompts for confirmation (see chRound below),
        // even between r2 and r4, so nobody accidentally enters Day 2 scores
        // into Day 1's card or vice versa.
        const rounds = [
            { id: 'r1', label: 'Springfield CC E/N', courseId: 'c1' },
            { id: 'r2', label: 'Black Mntn E/N Day 1', courseId: 'c3' },
            { id: 'r3', label: 'Pineapple Valley', courseId: 'c2' },
            { id: 'r4', label: 'Black Mntn E/N Day 2', courseId: 'c3' }
        ];

        window.scs = {};        // key: `${playerId}-${roundId}-${hole}` -> gross score
        window.aId = null;
        window.roundId = rounds[0].id;
        window.hNum = 1;
        window.gross = 4;
        window.roomId = 'vietnam2025';
        window.lbFilter = 'all'; // 'all' or a round id

        function currentCourse() {
            let r = rounds.find(r => r.id === window.roundId);
            return courses[r.courseId];
        }

        function init() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const roomParam = urlParams.get('room');
                if (roomParam) {
                    window.roomId = roomParam.replace(/[^a-zA-Z0-9-_]/gi, '');
                } else {
                    window.roomId = window.location.pathname.replace(/\//g, '').replace('index.html', '') || 'vietnam2025';
                }
            } catch(e) {
                console.log("Routing parameter fallback applied.");
            }

            document.getElementById('roomDisplay').innerText = "Room: " + window.roomId;

            renderSetupGrid();
            renderRoundPicker();
            renderLbFilters();
            window.rBoard();

            if (db) {
                db.ref('rooms/' + window.roomId + '/scores').on('value', (snap) => {
                    window.scs = snap.val() || {};
                    if (window.aId !== null) ldScore();
                    window.rBoard();
                });
            }
        }

        function renderSetupGrid() {
            document.getElementById('setup-grid').innerHTML = pls.map(p =>
                '<button class="sel-btn" onclick="window.selectPlayer(' + p.id + ')">' + p.name + '<br><span style="font-size:0.75rem; font-weight:normal; color:#666;">Hcp: ' + p.handicap + '</span></button>'
            ).join('');
        }

        function renderRoundPicker() {
            document.getElementById('roundPick').innerHTML = rounds.map(r =>
                '<button class="round-btn' + (r.id === window.roundId ? ' active' : '') + '" onclick="window.chRound(\'' + r.id + '\')">' + r.label + '</button>'
            ).join('');
        }

        function renderLbFilters() {
            let chips = [{ id: 'all', label: 'All Rounds' }].concat(rounds.map(r => ({ id: r.id, label: r.label })));
            document.getElementById('lbFilters').innerHTML = chips.map(c =>
                '<button class="lb-chip' + (c.id === window.lbFilter ? ' active' : '') + '" onclick="window.chLbFilter(\'' + c.id + '\')">' + c.label + '</button>'
            ).join('');
        }

        window.chRound = function(id) {
            if (id === window.roundId) return;

            let toRound = rounds.find(r => r.id === id);
            let toCourse = courses[toRound.courseId];

            // Always confirm on round switch — every round keeps its own score
            // sheet, even rounds that share the same physical course (e.g. the
            // two Black Mountain days both use Course C).
            let ok = confirm('Switch to ' + toRound.label + ' (' + toCourse.name + ')?\n\nThis is a separate score sheet from your current round.');
            if (!ok) return;

            window.roundId = id;
            window.hNum = 1;
            renderRoundPicker();
            upHole();
        };

        window.chLbFilter = function(id) {
            window.lbFilter = id;
            renderLbFilters();
            window.rBoard();
        };

        window.selectPlayer = function(id) {
            window.aId = id;
            let ap = pls.find(p => p.id === window.aId);
            if(ap) document.getElementById('pNameDisplay').innerText = ap.name + " (Hcp: " + ap.handicap + ")";

            document.getElementById('bottom-tabs').style.display = 'flex';
            window.sw('in');
        };

        window.showSetup = function() {
            window.aId = null;
            document.getElementById('bottom-tabs').style.display = 'none';
            document.querySelectorAll('.sc, .tab').forEach(el => el.classList.remove('active'));
            document.getElementById('s-setup').classList.add('active');
        };

        function upHole(){
            let course = currentCourse();
            let c = course.holes[window.hNum];
            document.getElementById('hd').innerText = "Hole " + window.hNum;
            document.getElementById('hdt').innerText = "Par " + c.par + " | SI " + c.si;
            document.getElementById('courseLabel').innerText = course.name;
            ldScore();
        }

        function ldScore(){
            let key = window.aId + "-" + window.roundId + "-" + window.hNum;
            window.gross = window.scs[key] || currentCourse().holes[window.hNum].par;
            document.getElementById('sd').innerText = window.gross;
        }

        function triggerToast(message) {
            const toastEl = document.getElementById('toast');
            if (toastEl) {
                toastEl.innerText = message;
                toastEl.classList.add('show');
                clearTimeout(window.tT);
                window.tT = setTimeout(() => { toastEl.classList.remove('show'); }, 1500);
            }
        }

        window.chHole = function(d) { window.hNum = Math.max(1, Math.min(18, window.hNum + d)); upHole(); };

        window.adj = function(v) {
            if (window.aId === null) return;
            window.gross = Math.max(1, window.gross + v);
            document.getElementById('sd').innerText = window.gross;

            let targetKey = window.aId + '-' + window.roundId + '-' + window.hNum;
            window.scs[targetKey] = window.gross;
            window.rBoard();

            triggerToast("Score Saved!");
            if (db) {
                db.ref('rooms/' + window.roomId + '/scores/' + targetKey).set(window.gross);
            }
        };

        window.sw = function(tab) {
            if (window.aId === null && tab !== 'setup') return;
            document.querySelectorAll('.sc, .tab').forEach(el => el.classList.remove('active'));
            document.getElementById('s-' + tab).classList.add('active');
            document.getElementById('t-' + tab).classList.add('active');
            if(tab === 'in') upHole();
            if(tab === 'bd') window.rBoard();
        };

        // Hidden admin reset: tap the room tag 5 times within 2s to trigger.
        // Not visible anywhere in the UI on purpose — this wipes ALL scores
        // for every player, in every round, for this room. Only meant to be
        // used once testing is done and you want a clean sheet before the
        // real trip starts.
        window.resetTapCount = 0;
        window.tapRoomTag = function() {
            window.resetTapCount++;
            clearTimeout(window.resetTapTimer);
            window.resetTapTimer = setTimeout(() => { window.resetTapCount = 0; }, 2000);

            if (window.resetTapCount >= 5) {
                window.resetTapCount = 0;
                clearTimeout(window.resetTapTimer);
                window.confirmResetAll();
            }
        };

        window.confirmResetAll = function() {
            let sure = confirm(
                '⚠️ RESET ALL SCORES?\n\n' +
                'This will permanently delete EVERY score for EVERY player ' +
                'in EVERY round for room "' + window.roomId + '".\n\n' +
                'This cannot be undone. Only do this once testing is finished ' +
                'and before the real trip begins.'
            );
            if (!sure) return;

            let doubleSure = confirm(
                'Are you absolutely sure? Type-check: this deletes ' +
                'ALL data for room "' + window.roomId + '" right now.'
            );
            if (!doubleSure) return;

            window.scs = {};
            if (window.aId !== null) ldScore();
            window.rBoard();
            triggerToast("All scores reset!");

            if (db) {
                db.ref('rooms/' + window.roomId + '/scores').remove();
            }
        };

        // Robust share with layered fallbacks. Some phone browsers (and any
        // page opened as a local file:// instead of a hosted https:// link)
        // don't support navigator.share or navigator.clipboard at all — calling
        // them directly can throw and silently do nothing. Every path below
        // ends in some visible feedback so the button never appears "dead".
        window.shareRoom = async function() {
            let url = window.location.href;

            if (navigator.share) {
                try {
                    await navigator.share({ title: 'VN Golf 2025', url: url });
                    return; // share sheet handled it
                } catch (e) {
                    if (e && e.name === 'AbortError') return; // user cancelled, that's fine
                    // otherwise fall through to the next fallback below
                }
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                try {
                    await navigator.clipboard.writeText(url);
                    triggerToast('Link copied!');
                    return;
                } catch (e) {
                    // fall through to final fallback below
                }
            }

            // Final fallback: works everywhere, needs no permissions.
            // Shows the link in a native prompt box so it can be selected and copied by hand.
            window.prompt('Copy this link to share:', url);
        };

        // Computes thru/net/points for one player over a given list of round objects
        function tallyPlayer(p, roundList) {
            let thru = 0, netDiff = 0, pts = 0;
            roundList.forEach(r => {
                let course = courses[r.courseId];
                for (let h = 1; h <= 18; h++) {
                    let mapKey = p.id + '-' + r.id + '-' + h;
                    if (window.scs[mapKey]) {
                        thru++;
                        let g = window.scs[mapKey], par = course.holes[h].par, si = course.holes[h].si;
                        let strokes = Math.floor(p.handicap / 18) + ((p.handicap % 18) >= si ? 1 : 0);
                        let net = g - strokes;
                        netDiff += (net - par);
                        let pMax = par - net + 2; if (pMax > 0) pts += pMax;
                    }
                }
            });
            return { thru, netDiff, pts };
        }

        window.rBoard = function() {
            let roundList = window.lbFilter === 'all' ? rounds : rounds.filter(r => r.id === window.lbFilter);
            let maxThru = roundList.length * 18;

            let lb = pls.map(p => {
                let { thru, netDiff, pts } = tallyPlayer(p, roundList);
                let isMe = (p.id === window.aId);
                return { id: p.id, name: p.name, thru, netDiff, points: pts, isMe };
            });

            lb.sort((a, b) => b.points - a.points || a.netDiff - b.netDiff);

            document.getElementById('lbl').innerHTML = lb.map((p, idx) => {
                let nt = p.netDiff === 0 ? 'E' : (p.netDiff > 0 ? '+' + p.netDiff : p.netDiff);
                let rowClass = p.isMe ? 'row my-row' : 'row';
                let thruDisplay = roundList.length > 1 ? (p.thru + '/' + maxThru) : p.thru;
                return '<div class="' + rowClass + '"><div style="width:10%; font-weight:bold;">' + (idx + 1) + '</div><div style="width:40%; font-weight:bold;">' + p.name + '</div><div style="width:15%; text-align:center; color:#666;">' + thruDisplay + '</div><div style="width:20%; text-align:center; font-weight:bold;">' + (p.thru === 0 ? '-' : nt) + '</div><div style="width:15%; text-align:right; font-weight:bold; color:var(--p);">' + p.points + '</div></div>';
            }).join('');
        };
        window.onload = init;
    </script>
</body>
</html>
